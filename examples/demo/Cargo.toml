[package]
name = "dioxus-storage-demo"
version = "0.1.0"
edition = "2021"
authors = ["Esteban Puello <eftech93@gmail.com>"]

[dependencies]
dioxus = { version = "0.6", features = ["web", "hooks"] }
dioxus-storage = { path = "../../dioxus-storage" }
dioxus-indexeddb = { path = "../../dioxus-indexeddb" }

serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde", "js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "HtmlElement", "Storage"] }
log = "0.4"
