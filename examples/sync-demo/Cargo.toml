[package]
name = "sync-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.6", features = ["web"] }
dioxus-logger = "0.6"
wasm-logger = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
urlencoding = "2.1"
gloo-timers = { version = "0.3", features = ["futures"] }
web-time = "1"

# Internal crates
dioxus-indexeddb = { path = "../../dioxus-indexeddb" }

# HTTP client for WASM
reqwasm = "0.5"

js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]
