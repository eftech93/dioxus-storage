name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy (WASM)
        run: cargo clippy --target wasm32-unknown-unknown --workspace -- -D warnings

  check:
    name: Check WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace compiles for WASM
        run: cargo check --target wasm32-unknown-unknown --workspace

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --target wasm32-unknown-unknown --workspace

  publish-dry-run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    needs: [format, lint, check, test, doc]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Note: only dry-run the leaf crate. Dependent crates cannot be
      # dry-run because their workspace dependencies are not yet on crates.io.
      - name: Dry-run publish dioxus-indexeddb
        run: cargo publish --dry-run --package dioxus-indexeddb --allow-dirty

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [format, lint, check, test, doc]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Version consistency check
        run: |
          WORKSPACE=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)".*/\1/')
          echo "Workspace version: $WORKSPACE"

          MISMATCH=0
          for crate in dioxus-indexeddb dioxus-client-storage dioxus-storage-sync; do
            CRATE_VERSION=$(grep '^version' "$crate/Cargo.toml" | head -1 | sed 's/.*= *"\(.*\)".*/\1/')
            echo "  $crate: $CRATE_VERSION"
            if [ "$CRATE_VERSION" != "$WORKSPACE" ]; then
              echo "❌ $crate version ($CRATE_VERSION) does not match workspace ($WORKSPACE)"
              MISMATCH=1
            fi
          done

          if [ "$MISMATCH" -eq 1 ]; then
            echo ""
            echo "❌ ERROR: Crate versions are not in sync. All crates must share the same version."
            exit 1
          fi

          echo "✅ All versions in sync: $WORKSPACE"

      - name: Extract local version
        id: local_version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Local version: $VERSION"

      - name: Fetch latest crates.io version
        id: crates_io_version
        run: |
          # Use dioxus-indexeddb as the canonical version check
          CRATES_IO_VERSION=$(curl -s https://crates.io/api/v1/crates/dioxus-indexeddb | jq -r '.crate.max_version')
          echo "version=$CRATES_IO_VERSION" >> $GITHUB_OUTPUT
          echo "Crates.io version: $CRATES_IO_VERSION"

      - name: Check if version should be published
        id: version_check
        run: |
          LOCAL="${{ steps.local_version.outputs.version }}"
          CRATES="${{ steps.crates_io_version.outputs.version }}"
          if [ "$LOCAL" != "$CRATES" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "📦 Version bumped: $CRATES -> $LOCAL"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No version bump. Current: $LOCAL"
          fi

      - name: Publish dioxus-indexeddb
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "🚀 Publishing dioxus-indexeddb v${{ steps.local_version.outputs.version }}..."
          cargo publish --token "$CARGO_REGISTRY_TOKEN" --package dioxus-indexeddb --allow-dirty
          echo "✅ dioxus-indexeddb published!"

      - name: Wait for crates.io indexing (indexeddb)
        if: steps.version_check.outputs.should_publish == 'true'
        run: sleep 45

      - name: Publish dioxus-client-storage
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "🚀 Publishing dioxus-client-storage v${{ steps.local_version.outputs.version }}..."
          cargo publish --token "$CARGO_REGISTRY_TOKEN" --package dioxus-client-storage --allow-dirty
          echo "✅ dioxus-client-storage published!"

      - name: Wait for crates.io indexing (client-storage)
        if: steps.version_check.outputs.should_publish == 'true'
        run: sleep 45

      - name: Publish dioxus-storage-sync
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "🚀 Publishing dioxus-storage-sync v${{ steps.local_version.outputs.version }}..."
          cargo publish --token "$CARGO_REGISTRY_TOKEN" --package dioxus-storage-sync --allow-dirty
          echo "✅ dioxus-storage-sync published!"

      - name: Create Git tag
        if: steps.version_check.outputs.should_publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.local_version.outputs.version }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "🏷️ Created and pushed tag $TAG"

      - name: Create GitHub Release
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.local_version.outputs.version }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
          echo "🎉 Created GitHub Release $TAG"
